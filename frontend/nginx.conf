# HSTS só faz sentido atrás de HTTPS (terminado no proxy da frente). Valor
# vazio faz o nginx omitir o cabeçalho.
map $http_x_forwarded_proto $hsts {
    https   "max-age=31536000";
    default "";
}

map $http_x_forwarded_proto $forwarded_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

# Log sem a query string: o WebSocket leva o token de acesso na URL.
log_format noquery '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                   '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;

    # Não anuncia a versão do nginx nas respostas e páginas de erro.
    server_tokens off;

    # Redirecionamentos relativos: atrás do proxy HTTPS o nginx só enxerga
    # http e mandaria o navegador para http:// (um salto a mais).
    absolute_redirect off;

    root /usr/share/nginx/html;
    index landing.html index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    # Também as respostas da API (lista da frota: ~1,3 KB por veículo em
    # JSON, uns 10× menor comprimida) e mesmo quando o pedido chega por um
    # proxy (Traefik).
    gzip_proxied any;
    gzip_comp_level 5;

    include /etc/nginx/security-headers.conf;

    # Os arquivos com hash no nome podem ser cacheados para sempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # Source maps ficam só na imagem de build: o código-fonte não é público.
    location ~* \.map$ {
        return 404;
    }

    # O HTML nunca é cacheado, senão o deploy novo não aparece.
    location = /landing.html {
        add_header Cache-Control "no-cache, must-revalidate";
        include /etc/nginx/security-headers.conf;
    }

    # App do cliente (PWA): qualquer rota do app cai no app/index.html.
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    # O index e o service worker do app nunca ficam em cache: é por eles que
    # a versão nova chega ao celular.
    location = /app/index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        include /etc/nginx/security-headers.conf;
    }

    location = /app/sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
        include /etc/nginx/security-headers.conf;
    }

    # O mime.types do nginx não conhece .webmanifest.
    location = /app/manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    # API e WebSocket vão para o backend.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /ws {
        access_log /var/log/nginx/access.log noquery;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # A conexão fica aberta: o timeout precisa ser longo.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA: qualquer rota desconhecida devolve o index.
    location = / {
        if ($host = app.farborastreadores.com.br) {
            return 302 /app/;
        }
        try_files /landing.html =404;
    }

    location / {
        try_files $uri $uri/ /landing.html;
    }
}

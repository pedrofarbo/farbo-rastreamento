# Cabeçalhos de segurança. Ficam num arquivo à parte porque o nginx descarta
# os add_header do server em todo location que tenha add_header próprio: cada
# um desses inclui este arquivo de novo.

# CSP: o painel só roda o próprio bundle. Os estilos inline vêm do React e
# do Leaflet; fontes do Google Fonts; mapa do OpenStreetMap; CEP do ViaCEP.
# Se a API ficar em outro domínio (VITE_API_URL), acrescente-o a connect-src.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src 'self' https://viacep.com.br; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
# O OpenStreetMap exige Referer nos tiles: manda só a origem, nunca a rota.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Localização só para a própria página: o app usa no "Onde estou" da cerca.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Só é enviado quando o proxy na frente avisa que a conexão é HTTPS.
add_header Strict-Transport-Security $hsts always;

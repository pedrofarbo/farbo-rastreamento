# Cabeçalhos de segurança. Ficam num arquivo à parte porque o nginx descarta
# os add_header do server em todo location que tenha add_header próprio: cada
# um desses inclui este arquivo de novo.

# CSP: o painel roda o próprio bundle e, só para o cartão de crédito, o
# formulário da AbacatePay (abacatepay.js), que carrega o Rinne e o Evervault:
# os campos do cartão e a autenticação do banco (3DS) vêm em iframes deles, e
# os scripts falam com as APIs deles. Os estilos inline vêm do React e do
# Leaflet; fontes do Google Fonts; mapa do OpenStreetMap; CEP do ViaCEP.
# A leitura da etiqueta pela câmera (código de barras e OCR do IMEI/ICCID)
# roda em WebAssembly: 'wasm-unsafe-eval' libera só compilar WebAssembly
# (não o eval de JavaScript), e o worker do OCR vem de /assets (script-src).
# Se a API ficar em outro domínio (VITE_API_URL), acrescente-o a connect-src.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://abacatepay.com https://pkgs.rinne.com.br https://js.evervault.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://*.rinne.com.br https://*.evervault.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://abacatepay.com https://*.rinne.com.br https://*.evervault.com; connect-src 'self' https://viacep.com.br https://api.abacatepay.com https://*.rinne.com.br https://*.evervault.com; frame-src https://*.evervault.com https://*.rinne.com.br https://*.abacatepay.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
# O OpenStreetMap exige Referer nos tiles: manda só a origem, nunca a rota.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Localização só para a própria página: o app usa no "Onde estou" da cerca.
# Câmera também: a leitura da etiqueta no cadastro de rastreador e de chip.
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Só é enviado quando o proxy na frente avisa que a conexão é HTTPS.
add_header Strict-Transport-Security $hsts always;
